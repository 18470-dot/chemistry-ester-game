```html
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ester Reaction Matching Game</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: #1e293b;
        min-height: 100vh;
    }

    header {
        text-align: center;
        padding: 35px 20px 20px;
    }

    header h1 {
        margin: 0;
        font-size: 38px;
        color: #4338ca;
    }

    header p {
        margin-top: 8px;
        color: #64748b;
    }

    .game-info {
        max-width: 900px;
        margin: 10px auto 25px;
        padding: 15px 20px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);

        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 15px;
    }

    .info-box {
        text-align: center;
        min-width: 100px;
    }

    .info-box span {
        display: block;
        font-size: 13px;
        color: #64748b;
    }

    .info-box strong {
        display: block;
        font-size: 24px;
        color: #4338ca;
    }

    .game-container {
        max-width: 1000px;
        margin: auto;
        padding: 10px 20px 50px;
    }

    .instruction {
        text-align: center;
        background: #eef2ff;
        border: 1px solid #c7d2fe;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 25px;
    }

    .board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }

    .card {
        height: 150px;
        perspective: 1000px;
        cursor: pointer;
    }

    .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.5s;
        transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
        transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 16px;

        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;

        padding: 15px;
    }

    .card-front {
        background: #4338ca;
        color: white;
        font-size: 40px;
        font-weight: bold;
        box-shadow: 0 6px 15px rgba(67,56,202,0.25);
    }

    .card-back {
        background: white;
        border: 3px solid #c7d2fe;
        transform: rotateY(180deg);
        font-size: 17px;
        font-weight: 600;
        line-height: 1.5;
    }

    .card.correct .card-back {
        border-color: #22c55e;
        background: #f0fdf4;
    }

    .card.wrong .card-back {
        border-color: #ef4444;
        background: #fef2f2;
    }

    .card.matched {
        pointer-events: none;
        opacity: 0.65;
    }

    button {
        display: block;
        margin: 30px auto 0;

        border: none;
        padding: 13px 28px;
        border-radius: 10px;

        background: #4338ca;
        color: white;

        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #3730a3;
    }

    .result {
        display: none;
        text-align: center;
        background: white;
        max-width: 600px;
        margin: 30px auto;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    .result h2 {
        color: #4338ca;
    }

    @media (max-width: 700px) {
        .board {
            grid-template-columns: repeat(3, 1fr);
        }

        .card {
            height: 130px;
        }

        header h1 {
            font-size: 28px;
        }
    }

    @media (max-width: 480px) {
        .board {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
</head>

<body>

<header>
    <h1>🧪 Ester Reaction Match</h1>
    <p>เกมจับคู่ปฏิกิริยาการเกิดเอสเทอร์และไฮโดรลิซิส</p>
</header>

<div class="game-info">

    <div class="info-box">
        <span>คะแนน</span>
        <strong id="score">0</strong>
    </div>

    <div class="info-box">
        <span>จับคู่แล้ว</span>
        <strong id="matched">0 / 8</strong>
    </div>

    <div class="info-box">
        <span>เวลา</span>
        <strong id="timer">60</strong>
    </div>

    <div class="info-box">
        <span>ผิด</span>
        <strong id="mistakes">0</strong>
    </div>

</div>

<div class="game-container">

    <div class="instruction">
        👆 <b>วิธีเล่น:</b>
        เปิดการ์ด 2 ใบ แล้วจับคู่ “สาร/ปฏิกิริยา” กับ “คำตอบที่ถูกต้อง”
    </div>

    <div class="board" id="board"></div>

    <button onclick="restartGame()">🔄 เล่นใหม่</button>

    <div class="result" id="result">
        <h2>🎉 จบเกม!</h2>

        <p id="resultText"></p>

        <button onclick="restartGame()">
            เล่นอีกครั้ง
        </button>
    </div>

</div>

<script>

/* ==========================================
   ข้อมูลสำหรับเกม
========================================== */

const pairs = [

    {
        id: 1,
        question: "CH₃COOH + C₂H₅OH",
        answer: "CH₃COOC₂H₅ + H₂O"
    },

    {
        id: 2,
        question: "กรดคาร์บอกซิลิก + แอลกอฮอล์",
        answer: "เอสเทอร์ + น้ำ"
    },

    {
        id: 3,
        question: "Esterification",
        answer: "ปฏิกิริยาการเกิดเอสเทอร์"
    },

    {
        id: 4,
        question: "CH₃COOC₂H₅ + H₂O",
        answer: "CH₃COOH + C₂H₅OH"
    },

    {
        id: 5,
        question: "Hydrolysis",
        answer: "ปฏิกิริยาไฮโดรลิซิสของเอสเทอร์"
    },

    {
        id: 6,
        question: "เอสเทอร์ + น้ำ",
        answer: "กรดคาร์บอกซิลิก + แอลกอฮอล์"
    },

    {
        id: 7,
        question: "CH₃COOC₂H₅ + NaOH",
        answer: "CH₃COONa + C₂H₅OH"
    },

    {
        id: 8,
        question: "Saponification",
        answer: "ไฮโดรลิซิสของเอสเทอร์ด้วยเบส"
    }

];


/* ==========================================
   ตัวแปรเกม
========================================== */

let cards = [];
let firstCard = null;
let secondCard = null;

let lockBoard = false;

let score = 0;
let matched = 0;
let mistakes = 0;

let timeLeft = 60;
let timer;


/* ==========================================
   สุ่ม Array
========================================== */

function shuffle(array) {

    return array.sort(() => Math.random() - 0.5);

}


/* ==========================================
   สร้างการ์ด
========================================== */

function createBoard() {

    const board = document.getElementById("board");

    board.innerHTML = "";

    cards = [];

    pairs.forEach(pair => {

        cards.push({
            id: pair.id,
            type: "question",
            text: pair.question
        });

        cards.push({
            id: pair.id,
            type: "answer",
            text: pair.answer
        });

    });

    shuffle(cards);

    cards.forEach((card, index) => {

        const cardElement = document.createElement("div");

        cardElement.classList.add("card");

        cardElement.dataset.id = card.id;
        cardElement.dataset.index = index;

        cardElement.innerHTML = `

            <div class="card-inner">

                <div class="card-front">
                    ?
                </div>

                <div class="card-back">
                    ${card.text}
                </div>

            </div>

        `;

        cardElement.addEventListener("click", flipCard);

        board.appendChild(cardElement);

    });

}


/* ==========================================
   เปิดการ์ด
========================================== */

function flipCard() {

    if (lockBoard) return;

    if (this === firstCard) return;

    if (this.classList.contains("matched")) return;

    this.classList.add("flipped");

    if (!firstCard) {

        firstCard = this;

        return;

    }

    secondCard = this;

    checkMatch();

}


/* ==========================================
   ตรวจสอบการจับคู่
========================================== */

function checkMatch() {

    const firstID = firstCard.dataset.id;
    const secondID = secondCard.dataset.id;

    if (firstID === secondID) {

        correctMatch();

    } else {

        wrongMatch();

    }

}


/* ==========================================
   จับคู่ถูก
========================================== */

function correctMatch() {

    firstCard.classList.add("correct");
    secondCard.classList.add("correct");

    firstCard.classList.add("matched");
    secondCard.classList.add("matched");

    matched++;

    score += 100;

    document.getElementById("score").textContent = score;

    document.getElementById("matched").textContent =
        matched + " / " + pairs.length;

    resetCards();

    if (matched === pairs.length) {

        endGame();

    }

}


/* ==========================================
   จับคู่ผิด
========================================== */

function wrongMatch() {

    lockBoard = true;

    mistakes++;

    score = Math.max(0, score - 20);

    document.getElementById("score").textContent = score;

    document.getElementById("mistakes").textContent = mistakes;

    firstCard.classList.add("wrong");
    secondCard.classList.add("wrong");

    setTimeout(() => {

        firstCard.classList.remove("flipped");
        secondCard.classList.remove("flipped");

        firstCard.classList.remove("wrong");
        secondCard.classList.remove("wrong");

        resetCards();

    }, 900);

}


/* ==========================================
   Reset
========================================== */

function resetCards() {

    firstCard = null;
    secondCard = null;

    lockBoard = false;

}


/* ==========================================
   Timer
========================================== */

function startTimer() {

    clearInterval(timer);

    timer = setInterval(() => {

        timeLeft--;

        document.getElementById("timer").textContent = timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timer);

            endGame();

        }

    }, 1000);

}


/* ==========================================
   จบเกม
========================================== */

function endGame() {

    clearInterval(timer);

    document.querySelectorAll(".card").forEach(card => {

        card.style.pointerEvents = "none";

    });

    const result = document.getElementById("result");

    result.style.display = "block";

    let message = "";

    if (matched === pairs.length) {

        message = `
            จับคู่ครบทุกคู่แล้ว! 🎉<br><br>
            คะแนน: <b>${score}</b><br>
            ใช้เวลา: <b>${60 - timeLeft}</b> วินาที<br>
            ผิด: <b>${mistakes}</b> ครั้ง
        `;

    } else {

        message = `
            หมดเวลา! ⏰<br><br>
            จับคู่ได้ <b>${matched}</b> / ${pairs.length} คู่<br>
            คะแนน: <b>${score}</b>
        `;

    }

    document.getElementById("resultText").innerHTML = message;

}


/* ==========================================
   เริ่มเกมใหม่
========================================== */

function restartGame() {

    score = 0;
    matched = 0;
    mistakes = 0;

    timeLeft = 60;

    firstCard = null;
    secondCard = null;

    lockBoard = false;

    document.getElementById("score").textContent = "0";
    document.getElementById("matched").textContent =
        "0 / " + pairs.length;

    document.getElementById("mistakes").textContent = "0";
    document.getElementById("timer").textContent = "60";

    document.getElementById("result").style.display = "none";

    createBoard();

    startTimer();

}


/* ==========================================
   เริ่มเกม
========================================== */

restartGame();

</script>

</body>
</html>
